<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sơ đồ Giường Bệnh – Khoa Nội Tiêu Hóa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f2f5; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-size: 14px; color: #6b7280;
    }
    #embed-container {
      width: 100%; height: 100vh;
      border: none; display: block;
    }
  </style>
</head>
<body>
  <div id="loading">⏳ Đang tải dữ liệu...</div>
  <iframe id="embed-container" style="display:none"></iframe>

  <script>
    const SUPERSET_URL = 'https://bi.leadbydata.org';
    const DASHBOARD_ID = '5aa2c332-9f87-46c7-8340-f6e9754c15b6';
    const USERNAME = 'admin';
    const PASSWORD = 'admin';

    async function getGuestToken() {
      // Step 1: login to get access token
      const loginRes = await fetch(`${SUPERSET_URL}/api/v1/security/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: USERNAME,
          password: PASSWORD,
          provider: 'db',
          refresh: true
        })
      });
      const loginData = await loginRes.json();
      const accessToken = loginData.access_token;

      // Step 2: get guest token
      const guestRes = await fetch(`${SUPERSET_URL}/api/v1/security/guest_token/`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${accessToken}`
        },
        body: JSON.stringify({
          resources: [{ type: 'dashboard', id: DASHBOARD_ID }],
          rls: [],
          user: { username: 'guest', first_name: 'Guest', last_name: 'User' }
        })
      });
      const guestData = await guestRes.json();
      return guestData.token;
    }

    async function embedDashboard() {
      try {
        const guestToken = await getGuestToken();
        const embedUrl = `${SUPERSET_URL}/embedded/${DASHBOARD_ID}?guest_token=${guestToken}`;
        
        const iframe = document.getElementById('embed-container');
        iframe.src = embedUrl;
        iframe.style.display = 'block';
        document.getElementById('loading').style.display = 'none';

        // Refresh guest token every 4 minutes (token expires in 5 min)
        setInterval(async () => {
          const newToken = await getGuestToken();
          iframe.src = `${SUPERSET_URL}/embedded/${DASHBOARD_ID}?guest_token=${newToken}`;
        }, 4 * 60 * 1000);

      } catch (err) {
        document.getElementById('loading').innerHTML = 
          '❌ Lỗi kết nối Superset: ' + err.message;
        console.error(err);
      }
    }

    embedDashboard();
  </script>
</body>
</html>
