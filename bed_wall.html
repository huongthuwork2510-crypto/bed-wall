<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sơ đồ giường bệnh</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:          #024593;
    --red:           #ea232b;
    --red-bg:        #ffefec;
    --orange:        #e8820c;
    --orange-bg:     #fff4e0;
    --green:         #2e8b57;
    --green-bg:      #e5ffec;
    --gray:          #d9d9d9;
    --gray-bg:       #f5f5f5;
    --text:          #1f2937;
    --text-soft:     #6b7280;
    --text-mute:     #9ca3af;
    --border:        #e5e7eb;
    --border-strong: #d8dde5;
    --white:         #ffffff;
    --page-bg:       #f0f2f5;
    --canvas:        #f4f6f9;
    --radius:        8px;
    --shadow:        0 1px 2px rgba(16,24,40,.05);
    --shadow-hover:  0 4px 14px rgba(16,24,40,.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--page-bg);
    color: var(--text);
    font-size: 13px;
    min-height: 100vh;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: 12px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }

  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toolbar-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  /* Segmented control */
  .seg-group {
    display: flex;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
    font-size: 12px;
    font-weight: 500;
  }

  .seg-group label {
    padding: 5px 14px;
    cursor: pointer;
    background: var(--white);
    color: var(--text-soft);
    user-select: none;
    transition: background .15s, color .15s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .seg-group input[type=radio] { display: none; }

  .seg-group input[type=radio]:checked + label {
    background: var(--navy);
    color: var(--white);
  }

  /* Control group + divider */
  .ctrl-group { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-soft); }
  .ctrl-label { font-size: 12px; color: var(--text-soft); white-space: nowrap; }
  .toolbar-divider { width: 1px; align-self: stretch; min-height: 22px; background: var(--border); }

  /* Select control */
  .ctrl-group select {
    font-family: inherit;
    font-size: 12px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    background: var(--white);
    cursor: pointer;
  }

  /* Legend */
  .legend {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11.5px;
    color: var(--text-soft);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── MAIN CONTENT ── */
  .content {
    padding: 16px 20px;
  }

  /* Summary bar */
  .summary-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .summary-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid transparent;
  }

  .chip-red    { background: var(--red-bg);    color: var(--red);    border-color: #fcd0ce; }
  .chip-orange { background: var(--orange-bg); color: var(--orange); border-color: #fddcb5; }
  .chip-green  { background: var(--green-bg);  color: var(--green);  border-color: #b6f0ca; }
  .chip-gray   { background: #f3f4f6; color: var(--text-soft); border-color: var(--border); }

  /* ── CLUSTER GRID ── */
  #clusters-container.mode-room {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  #clusters-container.mode-severity {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── CLUSTER CARD ── */
  .cluster-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .cluster-header {
    padding: 9px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(0deg, #fafafa, #fff);
    border-bottom: 1px solid var(--border);
  }

  .cluster-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-align: center;
    letter-spacing: .01em;
  }

  .cluster-dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
  }

  .cluster-beds {
    padding: 10px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }

  /* In severity mode, beds flow into a responsive grid */
  .mode-severity .cluster-beds {
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  }

  /* ── BED TILE (landscape, kiểu v2) ── */
  .bed-tile {
    position: relative;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--white);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 9px 12px 9px 15px;
    gap: 5px;
    min-height: 58px;
    cursor: pointer;
    transition: box-shadow .12s, transform .08s, border-color .12s;
  }

  .bed-tile::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  }
  .bed-tile.sev-red::before    { background: var(--red); }
  .bed-tile.sev-orange::before { background: var(--orange); }
  .bed-tile.sev-green::before  { background: var(--green); }
  .bed-tile.sev-empty::before  { background: var(--gray); }

  /* critical / warning glow */
  .bed-tile.sev-red    { background: linear-gradient(90deg, var(--red-bg), var(--white) 42%); }
  .bed-tile.sev-orange { background: linear-gradient(90deg, var(--orange-bg), var(--white) 46%); }

  .bed-tile:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
    border-color: var(--navy);
  }

  .bed-line1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bed-line2 { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .bed-no {
    font-size: 10.5px; font-weight: 700; color: var(--text-soft);
    letter-spacing: .02em; flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  .bed-name {
    font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bed-meta { font-size: 10.5px; color: var(--text-mute); white-space: nowrap; flex-shrink: 0; }
  .bed-dx {
    font-size: 11px; color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
  }
  .bed-badges { display: flex; align-items: center; gap: 5px; flex-shrink: 0; margin-left: auto; }

  .wbadge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 700; padding: 1px 7px 1px 6px; border-radius: 20px;
    font-variant-numeric: tabular-nums; line-height: 1.6;
  }
  .wbadge.orders   { background: #fef3c7; color: #b07400; }
  .wbadge.unsigned { background: var(--red-bg); color: var(--red); }
  .wbadge.labs     { background: #eef4ff; color: #2a4d8f; }
  .wbadge.clean    { background: #f3f4f6; color: #9ca3af; }

  /* staff line (doctor / nurse) — gated by info level */
  .bed-staff {
    display: none;
    align-items: center; flex-wrap: wrap; gap: 4px 14px;
    padding-top: 5px; margin-top: 1px;
    border-top: 1px dashed #eef0f3;
  }
  body.info-doctor .bed-staff,
  body.info-nurse  .bed-staff { display: flex; }

  .bed-person {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 600; color: var(--text-soft); white-space: nowrap;
  }
  .bed-person svg { color: var(--text-mute); flex-shrink: 0; }
  .bed-person.nurse { display: none; }
  .bed-person.nurse svg { color: var(--orange); }
  body.info-nurse .bed-person.nurse { display: inline-flex; }

  /* empty tile */
  .bed-tile.sev-empty {
    background: repeating-linear-gradient(135deg, #fafafa, #fafafa 7px, #f4f4f4 7px, #f4f4f4 14px);
    flex-direction: row; align-items: center; gap: 8px;
  }
  .bed-empty-text {
    font-size: 11px; font-weight: 700; color: var(--text-mute);
    display: inline-flex; align-items: center; gap: 5px;
  }

  /* ── DRAWER (kiểu v2) ── */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 92vw;
    background: var(--canvas); z-index: 201; box-shadow: -4px 0 24px rgba(0,0,0,.18);
    transform: translateX(100%); transition: transform .25s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-head {
    background: var(--white); padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .dh-name { font-size: 18px; font-weight: 700; margin: 0; color: var(--text); }
  .dh-meta { font-size: 12px; color: var(--text-mute); margin-top: 3px; }

  .drawer-close {
    background: none; border: none; cursor: pointer; color: var(--text-soft);
    padding: 4px; border-radius: 4px; font-size: 20px; line-height: 1; flex-shrink: 0;
  }
  .drawer-close:hover { background: #f3f4f6; }

  .drawer-body { padding: 16px 20px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

  .drawer-banner {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-radius: var(--radius); font-size: 13px; font-weight: 600;
  }
  .drawer-banner.red    { background: var(--red-bg);    color: var(--red); }
  .drawer-banner.orange { background: var(--orange-bg); color: #c2620a; }
  .drawer-banner.green  { background: var(--green-bg);  color: var(--green); }

  .d-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .d-card h4 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .03em;
    color: var(--text-mute); margin: 0; padding: 11px 14px 0; font-weight: 700;
  }
  .d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; padding: 10px 14px 12px; }
  .d-item { padding: 5px 0; }
  .di-label { font-size: 11px; color: var(--text-mute); }
  .di-value { font-size: 13.5px; font-weight: 600; color: var(--text); }
  .d-dx { padding: 6px 14px 14px; font-size: 15px; font-weight: 600; color: var(--text); }

  .d-vitals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 14px 14px; }
  .d-vital { text-align: center; border: 1px solid #eef0f3; border-radius: 6px; padding: 8px 4px; }
  .d-vital .v-label { font-size: 10px; color: var(--text-mute); text-transform: uppercase; }
  .d-vital .v-value { font-size: 18px; font-weight: 700; color: var(--text); }
  .d-vital .v-unit  { font-size: 10px; color: var(--text-mute); }
  .d-vital.v-abn  { background: var(--red-bg);    border-color: #f3c0c6; }
  .d-vital.v-abn  .v-value { color: var(--red); }
  .d-vital.v-warn { background: var(--orange-bg); border-color: #f6d7ae; }
  .d-vital.v-warn .v-value { color: #c2620a; }

  .d-list { padding: 6px 14px 12px; display: flex; flex-direction: column; gap: 7px; }
  .d-order { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; padding: 7px 10px; border-radius: 6px; background: #f4f6f9; }
  .o-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .o-text { flex: 1; color: var(--text); line-height: 1.35; }
  .o-time { font-size: 11px; color: var(--text-mute); margin-top: 2px; }
  .o-tag { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
  .o-tag.tag-pending { background: var(--orange-bg); color: #b07400; }
  .o-tag.tag-done    { background: var(--green-bg); color: var(--green); }

  .drawer-empty { color: var(--text-mute); text-align: center; padding: 48px 0; font-size: 13px; }
</style>
</head>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="toolbar-title">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#024593" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
    </svg>
    Sơ đồ giường bệnh
  </div>

  <div class="toolbar-divider"></div>

  <div class="ctrl-group">
    <span class="ctrl-label">Nhóm theo</span>
    <div class="seg-group">
      <input type="radio" name="groupMode" id="g-room" value="room" checked>
      <label for="g-room">Phòng</label>
      <input type="radio" name="groupMode" id="g-sev" value="severity">
      <label for="g-sev">Mức độ</label>

  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">Thông tin</span>
    <select id="infoLevel">
      <option value="basic">Tuổi, giới tính</option>
      <option value="doctor">Bác sĩ</option>
      <option value="nurse">Bác sĩ, điều dưỡng</option>
    </select>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> Cấp cứu</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div> Cảnh báo</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Bình thường</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--gray)"></div> Trống</div>
  </div>
</div>

<!-- CONTENT -->
<div class="content">
  <div class="summary-bar" id="summaryBar"></div>
  <div id="clusters-container" class="mode-room"></div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

// ── HELPERS ──
function bedLabelOf(d) { return d.bed_id.replace('G', '').replace(/(\d+)(\w)/, '$1·$2'); }

function vClass(kind, d) {
  if (kind === 'hr')   { const v = +d.hr;   return v >= 120 || v <= 50  ? 'v-abn' : v >= 100 || v <= 58 ? 'v-warn' : ''; }
  if (kind === 'temp') { const v = +d.temp; return v >= 39  || v <= 35.5 ? 'v-abn' : v >= 38 ? 'v-warn' : ''; }
  if (kind === 'spo2') { const v = +d.spo2; return v < 90 ? 'v-abn' : v < 94 ? 'v-warn' : ''; }
  if (kind === 'bp')   { const s = +d.bp_sys, di = +d.bp_dia; if (s >= 180 || s <= 90 || di >= 110 || di <= 55) return 'v-abn'; if (s >= 140 || di >= 90) return 'v-warn'; return ''; }
  return '';
}

// Y lệnh — sinh danh sách ổn định theo từng giường (khớp số y lệnh chờ)
const ORDER_TEXT = [
  'Truyền Noradrenalin 0,1 µg/kg/phút', 'Xét nghiệm khí máu động mạch (cấp)',
  'Kháng sinh Meropenem 1g mỗi 8h', 'Chụp X-quang ngực tại giường',
  'Truyền dịch NaCl 0,9% 500ml', 'Đo lactate máu lại sau 2h',
  'Theo dõi SpO₂ liên tục', 'Insulin truyền tĩnh mạch theo phác đồ',
  'Hội chẩn chuyên khoa Tim mạch', 'Lấy máu cấy tìm vi khuẩn',
  'Furosemid 40mg tiêm tĩnh mạch', 'Chụp CT sọ não không cản quang',
];
function seedRand(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function () {
    h += 0x6D2B79F5; let t = Math.imul(h ^ (h >>> 15), 1 | h);
    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function buildOrders(d) {
  const rng = seedRand(d.bed_id);
  const nPending = parseInt(d.pending_orders) || 0;
  const total = nPending + 1 + Math.floor(rng() * 3);
  const mins = ['00', '15', '30', '45'];
  const out = [];
  for (let i = 0; i < total; i++) {
    out.push({
      text: ORDER_TEXT[Math.floor(rng() * ORDER_TEXT.length)],
      time: String(Math.floor(rng() * 24)).padStart(2, '0') + ':' + mins[Math.floor(rng() * mins.length)],
      pending: i < nPending,
    });
  }
  return out.sort((a, b) => (a.pending === b.pending ? 0 : a.pending ? -1 : 1));
}

// ── RENDER ──
function render() {
  renderSummary();
  const container = document.getElementById('clusters-container');
  container.innerHTML = '';
  container.className = 'mode-' + groupMode;

  if (groupMode === 'room') renderByRoom(container);
  else renderBySeverity(container);
}

function renderSummary() {
  const occ = DATA.filter(d => d.occupied === 'true');
  const red = occ.filter(d => d.severity === 'red').length;
  const orange = occ.filter(d => d.severity === 'orange').length;
  const green = occ.filter(d => d.severity === 'green').length;
  const empty = DATA.filter(d => d.occupied === 'false').length;

  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-chip chip-red">Cấp cứu: <b>${red}</b></div>
    <div class="summary-chip chip-orange">Cảnh báo: <b>${orange}</b></div>
    <div class="summary-chip chip-green">Bình thường: <b>${green}</b></div>
    <div class="summary-chip chip-gray">Trống: <b>${empty}</b></div>
  `;
}

function attachClicks(card, beds) {
  card.querySelectorAll('.bed-tile').forEach((el, i) => {
    el.addEventListener('click', () => openDrawer(beds[i]));
  });
}

function renderByRoom(container) {
  const rooms = {};
  DATA.forEach(d => { (rooms[d.room_name] = rooms[d.room_name] || []).push(d); });

  Object.entries(rooms).forEach(([room, beds]) => {
    const card = document.createElement('div');
    card.className = 'cluster-card';
    card.innerHTML = `
      <div class="cluster-header">
        <span class="cluster-name">${room}</span>
      </div>
      <div class="cluster-beds">${beds.map(bedTile).join('')}</div>
    `;
    container.appendChild(card);
    attachClicks(card, beds);
  });
}

function renderBySeverity(container) {
  const groups = [
    { key: 'red',    label: 'Cấp cứu',      color: 'var(--red)',    beds: DATA.filter(d => d.occupied === 'true' && d.severity === 'red') },
    { key: 'orange', label: 'Cảnh báo',     color: 'var(--orange)', beds: DATA.filter(d => d.occupied === 'true' && d.severity === 'orange') },
    { key: 'green',  label: 'Bình thường',  color: 'var(--green)',  beds: DATA.filter(d => d.occupied === 'true' && d.severity === 'green') },
    { key: 'empty',  label: 'Giường trống', color: 'var(--gray)',   beds: DATA.filter(d => d.occupied === 'false') },
  ];

  groups.forEach(g => {
    if (g.beds.length === 0) return;
    const card = document.createElement('div');
    card.className = 'cluster-card';
    card.innerHTML = `
      <div class="cluster-header">
        <span class="cluster-dot" style="background:${g.color}"></span>
        <span class="cluster-name">${g.label}</span>
      </div>
      <div class="cluster-beds">${g.beds.map(bedTile).join('')}</div>
    `;
    container.appendChild(card);
    attachClicks(card, g.beds);
  });
}

function bedTile(d) {
  const isOcc = d.occupied === 'true';
  const bedLabel = bedLabelOf(d);

  if (!isOcc) {
    return `
      <div class="bed-tile sev-empty">
        <span class="bed-no">${bedLabel}</span>
        <span class="bed-empty-text">${IC.bed} Giường trống</span>
      </div>`;
  }

  const sev = d.severity || 'green';
  const orders = parseInt(d.pending_orders) || 0;
  const docs   = parseInt(d.unsigned_docs)  || 0;
  const labs   = parseInt(d.abnormal_labs)  || 0;
  const badges = (orders || docs || labs) ? `
    ${orders > 0 ? `<span class="wbadge orders">${IC.clip}${orders}</span>` : ''}
    ${docs   > 0 ? `<span class="wbadge unsigned">${IC.doc}${docs}</span>`  : ''}
    ${labs   > 0 ? `<span class="wbadge labs">${IC.lab}${labs}</span>`      : ''}
  ` : `<span class="wbadge clean">Đã xử lý</span>`;

  return `
    <div class="bed-tile sev-${sev}">
      <div class="bed-line1">
        <span class="bed-no">${bedLabel}</span>
        <span class="bed-name">${d.patient_name}</span>
      </div>
      <div class="bed-line2">
        <span class="bed-meta">${d.age} tuổi · ${d.sex}</span>
        <span class="bed-dx" title="${d.diagnosis}">${d.diagnosis}</span>
        <span class="bed-badges">${badges}</span>
      </div>
      <div class="bed-staff">
        <span class="bed-person">${IC.user} ${d.doctor}</span>
        <span class="bed-person nurse">${IC.heart} ${d.nurse}</span>
      </div>
    </div>`;
}

        <h4>Tình trạng xử trí</h4>
        <div class="d-grid">
          <div class="d-item"><div class="di-label">Xét nghiệm bất thường</div><div class="di-value" style="color:${(+d.abnormal_labs) ? 'var(--red)' : 'inherit'}">${d.abnormal_labs || 0}</div></div>
          <div class="d-item"><div class="di-label">Tờ điều trị chưa ký</div><div class="di-value" style="color:${(+d.unsigned_docs) ? 'var(--red)' : 'inherit'}">${d.unsigned_docs || 0}</div></div>
          <div class="d-item"><div class="di-label">Y lệnh chưa thực hiện</div><div class="di-value" style="color:${(+d.pending_orders) ? '#b07400' : 'inherit'}">${d.pending_orders || 0}</div></div>
          <div class="d-item"><div class="di-label">Y lệnh phát sinh hôm nay</div><div class="di-value">${d.new_orders_today || 0}</div></div>
        </div>
      </div>

      <div class="d-card">
        <h4>Danh sách y lệnh</h4>
        <div class="d-list">
          ${buildOrders(d).map(o => `
            <div class="d-order">
              <span class="o-dot" style="background:${o.pending ? 'var(--orange)' : 'var(--green)'}"></span>
              <div class="o-text">${o.text}<div class="o-time">${o.time}</div></div>
              <span class="o-tag ${o.pending ? 'tag-pending' : 'tag-done'}">${o.pending ? 'Chưa TH' : 'Đã TH'}</span>
            </div>`).join('')}
        </div>
      </div>
    `;
  }

  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

render();
</script>
</body>
</html>
