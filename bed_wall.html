<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sơ đồ Giường Bệnh – Khoa Nội Tiêu Hóa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:      #024593;
    --red:       #ea232b;
    --red-bg:    #ffefec;
    --orange:    #e8820c;
    --orange-bg: #fff4e0;
    --green:     #2e8b57;
    --green-bg:  #e5ffec;
    --gray:      #d9d9d9;
    --gray-bg:   #f5f5f5;
    --text:      #1f2937;
    --text-soft: #6b7280;
    --border:    #e5e7eb;
    --white:     #ffffff;
    --page-bg:   #f0f2f5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--page-bg);
    color: var(--text);
    font-size: 13px;
    min-height: 100vh;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }

  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toolbar-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  /* Segmented control */
  .seg-group {
    display: flex;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
    font-size: 12px;
    font-weight: 500;
  }

  .seg-group label {
    padding: 5px 14px;
    cursor: pointer;
    background: var(--white);
    color: var(--text-soft);
    user-select: none;
    transition: background .15s, color .15s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .seg-group input[type=radio] { display: none; }

  .seg-group input[type=radio]:checked + label {
    background: var(--navy);
    color: var(--white);
  }

  /* Density toggle */
  .density-group { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-soft); }
  .density-group label { cursor: pointer; padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border); }
  .density-group input[type=radio] { display: none; }
  .density-group input[type=radio]:checked + label { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* Info level toggle */
  .info-group { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .info-group select {
    font-family: inherit;
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    background: var(--white);
    cursor: pointer;
  }

  /* Legend */
  .legend {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11.5px;
    color: var(--text-soft);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── MAIN CONTENT ── */
  .content {
    padding: 16px 20px;
  }

  /* Summary bar */
  .summary-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .summary-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid transparent;
  }

  .chip-red    { background: var(--red-bg);    color: var(--red);    border-color: #fcd0ce; }
  .chip-orange { background: var(--orange-bg); color: var(--orange); border-color: #fddcb5; }
  .chip-green  { background: var(--green-bg);  color: var(--green);  border-color: #b6f0ca; }
  .chip-gray   { background: #f3f4f6; color: var(--text-soft); border-color: var(--border); }

  /* ── CLUSTER GRID ── */
  #clusters-container.mode-room {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  #clusters-container.mode-severity {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── CLUSTER CARD ── */
  .cluster-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .cluster-header {
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fafafa;
    border-bottom: 1px solid var(--border);
  }

  .cluster-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .cluster-accent {
    width: 4px;
    height: 16px;
    border-radius: 2px;
  }

  .cluster-count {
    font-size: 11px;
    color: var(--text-soft);
    font-weight: 400;
  }

  .cluster-beds {
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  /* In severity mode, beds go in a responsive grid */
  .mode-severity .cluster-beds {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 6px;
  }

  /* ── BED TILE ── */
  .bed-tile {
    border-radius: 6px;
    border: 1px solid var(--border);
    display: flex;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    background: var(--white);
    position: relative;
  }

  .bed-tile:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,.10);
    border-color: var(--navy);
  }

  /* Severity stripe */
  .bed-stripe {
    width: 5px;
    flex-shrink: 0;
  }

  .bed-tile.sev-red    .bed-stripe { background: var(--red); }
  .bed-tile.sev-orange .bed-stripe { background: var(--orange); }
  .bed-tile.sev-green  .bed-stripe { background: var(--green); }
  .bed-tile.sev-empty  .bed-stripe { background: var(--gray); }

  /* Gradient tint for critical/warning */
  .bed-tile.sev-red    { background: linear-gradient(90deg, var(--red-bg) 0%, var(--white) 50%); }
  .bed-tile.sev-orange { background: linear-gradient(90deg, var(--orange-bg) 0%, var(--white) 50%); }

  /* Empty bed pattern */
  .bed-tile.sev-empty {
    background: repeating-linear-gradient(
      -45deg,
      #f8f8f8,
      #f8f8f8 4px,
      var(--white) 4px,
      var(--white) 12px
    );
  }

  .bed-body {
    padding: 7px 10px;
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  /* Compact density */
  body.density-compact .bed-body { padding: 5px 8px; gap: 2px; }
  body.density-compact .bed-tile { border-radius: 5px; }

  /* Roomy density */
  body.density-roomy .bed-body { padding: 9px 12px; gap: 5px; }

  /* Row 1: bed id + name */
  .bed-row1 {
    display: flex;
    align-items: center;
    gap: 7px;
    justify-content: space-between;
  }

  .bed-id {
    font-size: 11px;
    font-weight: 700;
    color: var(--navy);
    background: #eef3fb;
    padding: 1px 6px;
    border-radius: 3px;
    flex-shrink: 0;
    letter-spacing: .3px;
  }

  .bed-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  /* Row 2: age/sex/diagnosis + badges */
  .bed-row2 {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: space-between;
  }

  .bed-info {
    font-size: 11.5px;
    color: var(--text-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }

  .badge-group {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 2px;
    white-space: nowrap;
  }

  .badge-order   { background: #fef3c7; color: #92400e; }
  .badge-doc     { background: #fee2e2; color: #991b1b; }
  .badge-lab     { background: #dbeafe; color: #1e40af; }
  .badge-clear   { background: #f3f4f6; color: #9ca3af; }

  /* Row 3: doctor/nurse (optional) */
  .bed-row3 {
    font-size: 11px;
    color: #9ca3af;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: none;
  }

  body.info-doctor   .bed-row3 { display: block; }
  body.info-nurse    .bed-row3 { display: block; }

  /* Empty tile */
  .bed-empty-label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #b0b8c4;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 0;
  }

  /* ── DRAWER ── */
  .drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 200;
  }

  .drawer-overlay.open { display: block; }

  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 380px;
    background: var(--white);
    box-shadow: -4px 0 24px rgba(0,0,0,.12);
    z-index: 201;
    transform: translateX(100%);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .drawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--white);
    z-index: 1;
  }

  .drawer-header h2 { font-size: 15px; font-weight: 700; color: var(--navy); }

  .drawer-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text-soft);
    padding: 4px;
    line-height: 1;
    border-radius: 4px;
  }

  .drawer-close:hover { background: var(--gray-bg); }

  .drawer-body { padding: 16px 18px; flex: 1; }

  .drawer-section { margin-bottom: 18px; }

  .drawer-section-title {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text-soft);
    margin-bottom: 8px;
  }

  .drawer-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 13px;
  }

  .drawer-label { color: var(--text-soft); min-width: 110px; flex-shrink: 0; }
  .drawer-val   { color: var(--text); font-weight: 500; flex: 1; }

  .vitals-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .vital-box {
    background: var(--gray-bg);
    border-radius: 6px;
    padding: 8px 10px;
    text-align: center;
  }

  .vital-label { font-size: 10px; color: var(--text-soft); margin-bottom: 3px; }
  .vital-val   { font-size: 16px; font-weight: 700; color: var(--text); }
  .vital-unit  { font-size: 10px; color: var(--text-soft); }

  .vital-box.alert-red    .vital-val { color: var(--red); }
  .vital-box.alert-orange .vital-val { color: var(--orange); }

  .sev-badge-large {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 4px;
  }

  .sev-badge-large.red    { background: var(--red-bg);    color: var(--red); }
  .sev-badge-large.orange { background: var(--orange-bg); color: var(--orange); }
  .sev-badge-large.green  { background: var(--green-bg);  color: var(--green); }
</style>
</head>

<!-- TOOLBAR -->

      <div class="legend-item"><div class="legend-dot" style="background:var(--gray)"></div> Trống</div>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="content">
  <div class="summary-bar" id="summaryBar"></div>
  <div id="clusters-container" class="mode-room"></div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2 id="drawerTitle">Chi tiết giường</h2>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

// ── STATE ──
let groupMode = 'room';
let currentBed = null;

// ── INIT ──
document.querySelectorAll('input[name="groupMode"]').forEach(r => {
  r.addEventListener('change', e => { groupMode = e.target.value; render(); });
});

document.querySelectorAll('input[name="density"]').forEach(r => {
  r.addEventListener('change', e => {
    document.body.className = document.body.className
      .replace(/density-\w+/, '') + ' density-' + e.target.value;
    document.body.className = document.body.className.replace(/\s+/, ' ').trim()
      + ' info-' + document.getElementById('infoLevel').value;
  });
});

document.getElementById('infoLevel').addEventListener('change', e => {
  document.body.className = document.body.className.replace(/info-\w+/, '') + ' info-' + e.target.value;
});

// Drawer
document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);

// ── RENDER ──
function render() {
  renderSummary();
  const container = document.getElementById('clusters-container');
  container.innerHTML = '';
  container.className = 'mode-' + groupMode;

  if (groupMode === 'room') renderByRoom(container);
  else renderBySeverity(container);
}

function renderSummary() {
  const occ = DATA.filter(d => d.occupied === 'true');
  const red = occ.filter(d => d.severity === 'red').length;
  const orange = occ.filter(d => d.severity === 'orange').length;
  const green = occ.filter(d => d.severity === 'green').length;
  const empty = DATA.filter(d => d.occupied === 'false').length;

  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-chip chip-red">🔴 Cấp cứu: <b>${red}</b></div>
    <div class="summary-chip chip-orange">🟠 Cảnh báo: <b>${orange}</b></div>
    <div class="summary-chip chip-green">🟢 Bình thường: <b>${green}</b></div>
    <div class="summary-chip chip-gray">⬜ Trống: <b>${empty}</b></div>
    <div class="summary-chip chip-gray" style="margin-left:auto">Tổng: <b>${DATA.length}</b> giường · <b>${occ.length}</b> có người</div>
  `;
}

function renderByRoom(container) {
  const rooms = {};
  DATA.forEach(d => {
    if (!rooms[d.room_name]) rooms[d.room_name] = [];
    rooms[d.room_name].push(d);
  });

  Object.entries(rooms).forEach(([room, beds]) => {
    const card = document.createElement('div');
    card.className = 'cluster-card';

    const occ = beds.filter(b => b.occupied === 'true').length;
    const hasCritical = beds.some(b => b.severity === 'red');
    const hasWarn = beds.some(b => b.severity === 'orange');
    const accentColor = hasCritical ? 'var(--red)' : hasWarn ? 'var(--orange)' : 'var(--green)';

    card.innerHTML = `
      <div class="cluster-header">
        <div class="cluster-header-left">
          <div class="cluster-accent" style="background:${accentColor}"></div>
          <span>${room}</span>
          <span class="cluster-count">${beds[0].cluster}</span>
        </div>
        <span class="cluster-count">${occ}/${beds.length}</span>
      </div>
      <div class="cluster-beds">${beds.map(bedTile).join('')}</div>
    `;
    container.appendChild(card);
    card.querySelectorAll('.bed-tile').forEach((el, i) => {
      el.addEventListener('click', () => openDrawer(beds[i]));
    });
  });
}

function renderBySeverity(container) {
  const groups = [
    { key: 'red',    label: '🔴 Cấp cứu',     color: 'var(--red)',    beds: DATA.filter(d => d.severity === 'red') },
    { key: 'orange', label: '🟠 Cảnh báo',    color: 'var(--orange)', beds: DATA.filter(d => d.severity === 'orange') },
    { key: 'green',  label: '🟢 Bình thường', color: 'var(--green)',  beds: DATA.filter(d => d.severity === 'green') },
    { key: 'empty',  label: '⬜ Giường trống', color: 'var(--gray)',   beds: DATA.filter(d => d.occupied === 'false') },
  ];

  groups.forEach(g => {
    if (g.beds.length === 0) return;
    const card = document.createElement('div');
    card.className = 'cluster-card';
    card.innerHTML = `
      <div class="cluster-header">
        <div class="cluster-header-left">
          <div class="cluster-accent" style="background:${g.color}"></div>
          <span>${g.label}</span>
        </div>
        <span class="cluster-count">${g.beds.length} giường</span>
      </div>
      <div class="cluster-beds">${g.beds.map(bedTile).join('')}</div>
    `;
    container.appendChild(card);
    card.querySelectorAll('.bed-tile').forEach((el, i) => {
      el.addEventListener('click', () => openDrawer(g.beds[i]));
    });
  });
}

function bedTile(d) {
  const isOcc = d.occupied === 'true';
  const sev = isOcc ? (d.severity || 'green') : 'empty';
  const sevClass = 'sev-' + sev;

  if (!isOcc) {
    return `
      <div class="bed-tile ${sevClass}">
        <div class="bed-stripe"></div>
        <div class="bed-body">
          <div class="bed-empty-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#b0b8c4" stroke-width="2"><path d="M2 20v-8a2 2 0 012-2h16a2 2 0 012 2v8"/><path d="M2 10V6a2 2 0 012-2h4l2 4"/></svg>
            ${d.bed_id.replace('G','').replace(/(\d+)(\w)/, '$1·$2')} – Giường trống
          </div>
        </div>
      </div>`;
  }

  const bedLabel = d.bed_id.replace('G','').replace(/(\d+)(\w)/, '$1·$2');
  const orders = parseInt(d.pending_orders) || 0;
  const docs   = parseInt(d.unsigned_docs)  || 0;
  const labs   = parseInt(d.abnormal_labs)  || 0;
  const hasWork = orders > 0 || docs > 0 || labs > 0;

  const badges = hasWork ? `
    ${orders > 0 ? `<span class="badge badge-order">⚡ ${orders}</span>` : ''}
    ${docs   > 0 ? `<span class="badge badge-doc">📋 ${docs}</span>`    : ''}
    ${labs   > 0 ? `<span class="badge badge-lab">🔬 ${labs}</span>`   : ''}
  ` : `<span class="badge badge-clear">✓ Đã xử lý</span>`;

  const diag = d.diagnosis.length > 32 ? d.diagnosis.slice(0,32)+'…' : d.diagnosis;

  return `
    <div class="bed-tile ${sevClass}">
      <div class="bed-stripe"></div>
      <div class="bed-body">
        <div class="bed-row1">
          <div style="display:flex;align-items:center;gap:6px;min-width:0;flex:1">
            <span class="bed-id">${bedLabel}</span>
            <span class="bed-name">${d.patient_name}</span>
          </div>
        </div>
        <div class="bed-row2">
          <span class="bed-info">${d.age}t · ${d.sex} · ${diag}</span>
          <div class="badge-group">${badges}</div>
        </div>
        <div class="bed-row3">${d.doctor} · ${d.nurse}</div>
      </div>
    </div>`;
}

// ── DRAWER ──
function openDrawer(d) {
  currentBed = d;
  const isOcc = d.occupied === 'true';
  const title = d.bed_id.replace('G','').replace(/(\d+)(\w)/, 'Giường $1·$2');
  document.getElementById('drawerTitle').textContent = title;

  let body = '';
  if (!isOcc) {
    body = '<div style="color:var(--text-soft);text-align:center;padding:40px 0">Giường trống – không có thông tin bệnh nhân</div>';
  } else {
    const sevColor = d.severity === 'red' ? 'red' : d.severity === 'orange' ? 'orange' : 'green';

    const hrAlert  = (parseInt(d.hr) >= 120 || parseInt(d.hr) <= 50) ? 'alert-red' : parseInt(d.hr) >= 100 ? 'alert-orange' : '';
    const spo2Alert= parseInt(d.spo2) <= 89 ? 'alert-red' : parseInt(d.spo2) <= 93 ? 'alert-orange' : '';
    const bpAlert  = parseInt(d.bp_sys) >= 180 || parseInt(d.bp_sys) <= 90 ? 'alert-red' : parseInt(d.bp_sys) >= 140 ? 'alert-orange' : '';
    const tempAlert= (parseFloat(d.temp) >= 39 || parseFloat(d.temp) <= 35.5) ? 'alert-red' : parseFloat(d.temp) >= 38 ? 'alert-orange' : '';

    body = `
      <div class="drawer-section">
        <div class="drawer-section-title">Mức độ</div>
        <div class="sev-badge-large ${sevColor}">${d.severity_label}</div>
      </div>

      <div class="drawer-section">
        <div class="drawer-section-title">Thông tin bệnh nhân</div>
        <div class="drawer-row"><span class="drawer-label">Mã BN</span><span class="drawer-val">${d.patient_id} · ${d.mrn}</span></div>
        <div class="drawer-row"><span class="drawer-label">Họ tên</span><span class="drawer-val">${d.patient_name}</span></div>
        <div class="drawer-row"><span class="drawer-label">Tuổi · Giới</span><span class="drawer-val">${d.age} tuổi · ${d.sex}</span></div>
        <div class="drawer-row"><span class="drawer-label">Chẩn đoán</span><span class="drawer-val">${d.diagnosis}</span></div>
        <div class="drawer-row"><span class="drawer-label">Nhập viện</span><span class="drawer-val">${d.admit_date} (${d.los_days} ngày)</span></div>
        <div class="drawer-row"><span class="drawer-label">Phòng · Cụm</span><span class="drawer-val">${d.room_name} · ${d.cluster}</span></div>
      </div>

      <div class="drawer-section">
        <div class="drawer-section-title">Dấu hiệu sinh tồn</div>
        <div class="vitals-grid">
          <div class="vital-box ${hrAlert}">
            <div class="vital-label">Mạch</div>
            <div class="vital-val">${d.hr}</div>
            <div class="vital-unit">lần/phút</div>
          </div>
          <div class="vital-box ${tempAlert}">
            <div class="vital-label">Nhiệt độ</div>
            <div class="vital-val">${d.temp}</div>
            <div class="vital-unit">°C</div>
          </div>
          <div class="vital-box ${spo2Alert}">
            <div class="vital-label">SpO₂</div>
            <div class="vital-val">${d.spo2}</div>
            <div class="vital-unit">%</div>
          </div>
          <div class="vital-box ${bpAlert}">
            <div class="vital-label">Huyết áp</div>
            <div class="vital-val" style="font-size:14px">${d.bp_sys}/${d.bp_dia}</div>
            <div class="vital-unit">mmHg</div>
          </div>
        </div>
      </div>

      <div class="drawer-section">
        <div class="drawer-section-title">Công việc cần xử lý</div>
        <div class="drawer-row"><span class="drawer-label">Y lệnh chờ</span><span class="drawer-val">${d.pending_orders || 0}</span></div>
        <div class="drawer-row"><span class="drawer-label">Y lệnh hôm nay</span><span class="drawer-val">${d.new_orders_today || 0}</span></div>
        <div class="drawer-row"><span class="drawer-label">Hồ sơ chưa ký</span><span class="drawer-val" style="color:var(--red)">${d.unsigned_docs || 0}</span></div>
        <div class="drawer-row"><span class="drawer-label">XN bất thường</span><span class="drawer-val" style="color:#1e40af">${d.abnormal_labs || 0}</span></div>
      </div>

      <div class="drawer-section">
        <div class="drawer-section-title">Nhân sự phụ trách</div>
        <div class="drawer-row"><span class="drawer-label">Bác sĩ</span><span class="drawer-val">${d.doctor}</span></div>
        <div class="drawer-row"><span class="drawer-label">Điều dưỡng</span><span class="drawer-val">${d.nurse}</span></div>
      </div>
    `;
  }

  document.getElementById('drawerBody').innerHTML = body;
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

render();
</script>
</body>
</html>
